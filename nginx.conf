proxy_cache_path /tmp/hd2-cache levels=1 keys_zone=hd2:1m max_size=20m inactive=10m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /api/hd2/ {
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $hd2 api.live.prod.thehelldiversgame.com;
        rewrite ^/api/hd2/(.*)$ /api/$1 break;
        proxy_pass https://$hd2;
        proxy_ssl_server_name on;
        proxy_set_header Host $hd2;
        proxy_set_header Accept-Language es-ES;
        proxy_set_header Cookie "";
        proxy_cache hd2;
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
